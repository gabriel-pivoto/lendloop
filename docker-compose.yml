# Local stack for the automation side of LendLoop.
#
#   docker compose up -d                      n8n + Mailpit
#   docker compose --profile app up -d        ...plus the Next.js app (production build)
#   docker compose --profile tunnel up -d     ...plus a public tunnel to n8n, needed
#                                             only when Convex runs in the cloud
#
# Convex itself runs via `npx convex dev` (cloud dev deployment or local backend).
name: lendloop

services:
  n8n:
    image: n8nio/n8n:2.47.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    entrypoint: ["tini", "--", "/bin/sh", "/lendloop/bootstrap.sh"]
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Code nodes need `crypto` for HMAC and read the secret from the env.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Prune execution history (data minimization: emails pass through here).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # LendLoop integration
      LENDLOOP_HMAC_SECRET: ${LENDLOOP_HMAC_SECRET:?Set LENDLOOP_HMAC_SECRET in .env}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:?Set CONVEX_SITE_URL in .env}
      LENDLOOP_MAIL_FROM: ${LENDLOOP_MAIL_FROM:-LendLoop <no-reply@lendloop.local>}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/lendloop:ro
    depends_on:
      - mailpit

  # Catches every email n8n sends. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "8025:8025"

  web:
    profiles: ["app"]
    build:
      context: .
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "3000:3000"

  # Quick public HTTPS URL for n8n, so a cloud Convex deployment can reach the
  # webhook. Prints the URL in `docker compose logs tunnel`.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.11.0
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
